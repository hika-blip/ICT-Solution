{% extends "base.html" %}
{% block title %}歩行ログ｜ひたふら{% endblock %}
{% block content %}
<main class="screen">
  <a href="/home" class="back-link">← ホームに戻る</a>
  <h2 class="screen-title">歩行ログ</h2>
  <p class="walk-speed" id="speed">あなたの歩く速さを計算しています…</p>
  <ul class="walk-list" id="list"></ul>
</main>
<script src="{{ url_for('static', path='js/walk_format.js') }}"></script>
<script>
(async () => {
  const speedEl = document.getElementById("speed");
  const listEl = document.getElementById("list");

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  const [speedRes, listRes] = await Promise.all([fetch("/api/walks/speed"), fetch("/api/walks")]);
  if (speedRes.status === 401 || listRes.status === 401) { location.href = "/login"; return; }
  const speed = await speedRes.json();
  const walks = await listRes.json();

  speedEl.textContent = "";
  speedEl.append("あなたの歩く速さ：", el("strong", "", walkFormat.speed(speed.speed_m_per_min)));
  speedEl.append(el("small", "", speed.is_default
    ? "まだ記録が足りないため、標準の速さです。200 m 以上歩いて記録すると、あなたの速さになります。"
    : `直近 ${speed.walks} 回の記録の、坂道を除いた区間から計算しています。経路検索の所要時間に使われます。`));
  const rest = Math.max(1, Math.ceil(speed.slope_min_distance_m - speed.slope_distance_m));
  speedEl.append(el("small", "", `坂道での速さ：${walkFormat.speed(speed.slope_speed_m_per_min)}`
    + (speed.slope_is_default
      ? `（仮の値：ふだんの速さから決めています）。坂道をあと 約 ${rest} m 歩いて記録すると、あなたの坂道での速さになります。`
      : `（直近の記録で坂道を歩いた 約 ${Math.round(speed.slope_distance_m)} m から計算）。`)
    + "経路検索では、坂道で遅くなる分を含めて一番早く着く道を案内します。"));

  if (!walks.length) {
    listEl.appendChild(el("li", "walk-empty", "まだ記録がありません。ホームの右下の「記録」ボタンから記録できます。"));
    return;
  }
  for (const w of walks) {
    const a = el("a");
    a.href = `/walks/${w.id}`;
    a.append(
      el("span", "walk-date", walkFormat.date(w.started_at)),
      el("span", "walk-meta",
        `${walkFormat.distance(w.distance_m)}・${walkFormat.duration(w.duration_s)}・${walkFormat.speed(w.speed_m_per_min)}`),
    );
    const li = el("li");
    li.appendChild(a);
    listEl.appendChild(li);
  }
})();
</script>
{% endblock %}
