{% extends "base.html" %}
{% block title %}管理者ログイン｜ひたふら{% endblock %}
{% block content %}
<main class="screen">
  <header class="brand">
    <h1 class="brand-name">ひたふら</h1>
    <p class="brand-tagline">管理画面（自治体向け）</p>
  </header>

  <h2 class="screen-title">管理者ログイン</h2>

  {% if error %}
  <p class="alert" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/admin/login" class="form">
    <label class="field">
      <span class="field-label">ログインID</span>
      <input type="text" name="login_id" value="{{ login_id }}" autocomplete="username" maxlength="32" required>
    </label>
    <label class="field">
      <span class="field-label">パスワード</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="button button-primary">ログイン</button>
  </form>
  <p class="field-hint" style="margin-top: 24px;">
    管理者アカウントは、サーバのPCで <code>python scripts/create_admin.py</code> を実行して作成します。
  </p>
</main>
{% endblock %}
