{% extends "base.html" %}
{% block title %}ホーム｜ひたふら{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="{{ url_for('static', path='css/facilities.css') }}">
<style>
  /* 地図を全画面にして、操作は地図の上に浮かべる（上部バーは _menu.html の navbar-floating） */
  .app { position: relative; }
  .screen-map { position: relative; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #map { flex: 1; height: 100vh; height: 100dvh; }
  @media (min-width: 600px) { #map { height: calc(100vh - 48px); } }  /* PCでは .app の上下の余白の分を引く */
  .map-top {
    position: absolute; top: 12px; left: 68px; right: 12px; z-index: 1050;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none;
  }
  .map-top > * { max-width: 100%; pointer-events: auto; }  /* 長い案内文で画面の横幅を超えないようにする */
  /* 1段目：平常時／緊急時の切り替えと、ピンの絞り込み */
  .map-top-row { display: flex; align-items: center; gap: 8px; }
  .pin-filter {
    min-width: 0; height: 44px; padding: 0 10px; font-family: inherit; font-size: 0.85rem; font-weight: 700;
    color: var(--text); background: #fff; border: none; border-radius: 22px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3); cursor: pointer;
  }
  .route-banner[hidden] { display: none; }
  .route-banner {
    display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 6px 6px 6px 14px;
    background: #fff; border-radius: 22px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .route-message { margin: 0; font-size: 0.85rem; line-height: 1.4; }
  #message { white-space: pre-line; }  /* 経路の案内は「経路の内容」「もう一方との比較」「計算に使った速さ」の3行 */
  /* 通常／坂道考慮の切り替え（経路を表示しているときだけ） */
  .route-modes[hidden] { display: none; }
  .route-modes {
    display: flex; overflow: hidden; background: #fff; border-radius: 22px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .route-mode {
    min-height: 40px; padding: 0 16px; font-family: inherit; font-size: 0.85rem; font-weight: 700;
    color: #555; background: #fff; border: 0; cursor: pointer;
  }
  .route-mode[aria-pressed="true"] { color: #fff; background: #2E6BB0; }
  .route-reset {
    flex: none; width: 32px; height: 32px; font-size: 1.2rem; line-height: 1; color: var(--muted);
    background: transparent; border: none; border-radius: 50%; cursor: pointer;
  }
  .route-reset:hover { background: rgba(0, 0, 0, 0.06); }
  /* 歩行の記録中・保存結果の表示（walklog.js） */
  .walk-badge {
    margin: 0; padding: 4px 12px; font-size: 0.85rem; font-weight: 700; color: #fff;
    background: #E8710A; border-radius: 999px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }
  /* 右下のボタン（上から ピン・記録・現在地） */
  .map-fabs {
    position: absolute; right: 12px; bottom: 32px; z-index: 1050;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .map-fab {
    min-width: 56px; height: 44px; padding: 0 14px; font-family: inherit; font-size: 0.9rem; font-weight: 700;
    color: var(--blue); background: #fff; border: none; border-radius: 22px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3); cursor: pointer;
  }
  .map-fab:hover { background: var(--blue-light); }
  .map-fab-pin { color: #fff; background: #2E9D4F; }
  .map-fab-pin:hover { background: #237A3D; }
  .map-fab-walk.walk-recording { color: #fff; background: #E8710A; }
  .map-fab-walk.walk-recording:hover { background: #C55F08; }
  /* 現在地ボタン：丸いアイコン */
  .map-fab-locate {
    display: flex; align-items: center; justify-content: center;
    width: 48px; min-width: 0; height: 48px; padding: 0; border-radius: 50%;
  }
  .map-fab-locate svg { width: 26px; height: 26px; }
  .current-status {
    max-width: 240px; padding: 4px 8px; font-size: 0.8rem;
    background: rgba(255, 255, 255, 0.9); border-radius: 6px;
  }
  /* 平常時／緊急時の切り替え（emergency.js）：地図の上に浮かべる */
  .map-panel { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 100%; }
  .map-panel[hidden] { display: none; }
  .mode-tabs {
    display: flex; overflow: hidden; background: #fff; border-radius: 22px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .mode-tab {
    min-height: 44px; padding: 0 18px; font-family: inherit; font-size: 0.9rem; font-weight: 700;
    color: #555; background: #fff; border: 0; cursor: pointer;
  }
  .mode-tab[aria-selected="true"] { color: #fff; background: var(--blue); }
  .mode-tab.mode-tab-emergency[aria-selected="true"] { color: #fff; background: #D93025; }
  /* 緊急時は避難に関係しないピン・現在地ボタンを隠す */
  .screen-map:has(#panel-emergency:not([hidden])) .map-fabs { display: none; }
  .evac-panel {
    width: 340px; max-height: calc(100dvh - 160px); overflow-y: auto; padding: 10px 12px;
    background: #fff; border-radius: 16px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .evac-panel .route-message { margin: 0 0 8px; font-size: 0.85rem; line-height: 1.4; }
  .evac-panel .route-actions { display: flex; gap: 8px; }
  .evac-panel .route-actions .button { height: 40px; margin-top: 0; font-size: 0.85rem; }
  /* 3件を横に並べ、左右にスワイプして切り替える（枠の影が切れないよう左右に3pxの余白を取る） */
  .evac-slider { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
  .evac-slider[hidden] { display: none; }
  .evac-arrow {
    flex: none; width: 32px; height: 44px; padding: 0; font-family: inherit; font-size: 1.6rem; line-height: 1;
    color: var(--blue); background: transparent; border: none; border-radius: 8px; cursor: pointer;
  }
  .evac-arrow:hover:not(:disabled) { background: var(--blue-light); }
  .evac-arrow:disabled { color: #bbb; cursor: default; }
  .evac-list {
    position: relative; flex: 1; min-width: 0; list-style: none; margin: 0; padding: 3px; display: flex; gap: 8px;
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 3px; scrollbar-width: none;
  }
  .evac-list::-webkit-scrollbar { display: none; }
  .evac-list > li { flex: 0 0 100%; scroll-snap-align: start; }
  .evac-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; text-align: left;
    font-family: inherit; font-size: 0.9rem; color: inherit; background: #fff;
    border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .evac-item[aria-pressed="true"] { border-color: var(--evac-color); box-shadow: 0 0 0 1px var(--evac-color); }
  .evac-rank {
    flex: none; width: 26px; height: 26px; line-height: 26px; text-align: center;
    font-weight: 700; color: #fff; border-radius: 50%; background: var(--evac-color);
  }
  .evac-name { font-weight: 700; }
  .evac-detail { display: block; font-size: 0.82rem; color: #555; }
  /* ハザードマップの重ね表示（hazard.js） */
  .hazard-select {
    width: 100%; height: 44px; margin-top: 8px; padding: 0 10px; font-family: inherit; font-size: 0.85rem; font-weight: 700;
    color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .evac-panel .hazard-note { margin: 6px 0 0; font-size: 0.8rem; line-height: 1.4; color: #555; }
  .hazard-legend { margin-top: 6px; font-size: 0.85rem; }
  .hazard-legend summary { min-height: 32px; line-height: 32px; font-weight: 700; cursor: pointer; }
  .hazard-legend img { display: block; max-width: 100%; margin-top: 4px; }
</style>
{% set map_tools = true %}
{% include "_menu.html" %}
<main class="screen screen-map">
  <div id="map"></div>
  <div class="map-top">
    <div class="map-top-row">
      <div class="mode-tabs" role="tablist" aria-label="モード切り替え">
        <button type="button" class="mode-tab" id="tab-normal" role="tab" aria-selected="true" aria-controls="panel-normal">平常時</button>
        <button type="button" class="mode-tab mode-tab-emergency" id="tab-emergency" role="tab" aria-selected="false" aria-controls="panel-emergency">緊急時</button>
      </div>
      <!-- ピンの絞り込み（pins.js がタグの選択肢を追加する） -->
      <select class="pin-filter" id="pin-filter" aria-label="ピンをタグで絞り込み"><option value="">ピン：すべて</option></select>
    </div>
    <div class="map-panel" id="panel-normal" role="tabpanel" aria-labelledby="tab-normal">
      <!-- 経路の案内。表示する内容があるときだけ出す -->
      <div class="route-banner" id="route-banner" hidden>
        <p class="route-message" id="message"></p>
        <button type="button" class="route-reset" id="reset" aria-label="やり直す" title="やり直す" hidden>×</button>
      </div>
      <!-- 経路の選び方の切り替え。経路を表示しているときだけ出す -->
      <div class="route-modes" id="route-modes" role="group" aria-label="経路の選び方" hidden>
        <button type="button" class="route-mode" data-mode="normal" aria-pressed="false">通常</button>
        <button type="button" class="route-mode" data-mode="slope" aria-pressed="true">坂道考慮</button>
      </div>
      <p class="walk-badge" id="walk-badge" role="status" hidden></p>
    </div>
    <div class="map-panel" id="panel-emergency" role="tabpanel" aria-labelledby="tab-emergency" hidden>
      <div class="evac-panel">
        <p class="route-message" id="evac-message">「避難場所を探す」を押すと、現在地から近い避難場所3か所への経路を表示します。</p>
        <div class="route-actions">
          <button type="button" class="button button-primary" id="evac-search">避難場所を探す</button>
          <button type="button" class="button button-secondary" id="evac-reset">やり直す</button>
        </div>
        <!-- ハザードマップの重ね表示（hazard.js） -->
        <select class="hazard-select" id="hazard-select" aria-label="地図に重ねるハザードマップ">
          <option value="">ハザードマップ：なし</option>
          <option value="flood">洪水</option>
          <option value="tsunami">津波</option>
          <option value="landslide">土砂災害</option>
        </select>
        <p class="hazard-note" id="hazard-note" role="status" hidden></p>
        <details class="hazard-legend" id="hazard-legend" hidden>
          <summary>凡例</summary>
          <div id="hazard-legend-images"></div>
        </details>
        <!-- テスト用：範囲内のランダムな地点から探す（本番では消す） -->
        <div class="route-actions" style="margin-top: 8px;">
          <button type="button" class="button button-secondary" id="evac-random">【テスト】ランダムな地点から探す</button>
        </div>
        <div class="evac-slider" id="evac-slider" hidden>
          <button type="button" class="evac-arrow" id="evac-prev" aria-label="前の避難場所">‹</button>
          <ol class="evac-list" id="evac-list"></ol>
          <button type="button" class="evac-arrow" id="evac-next" aria-label="次の避難場所">›</button>
        </div>
      </div>
    </div>
  </div>
  <div class="map-fabs">
    <button type="button" class="map-fab map-fab-pin" id="pin-add">ピン</button>
    <button type="button" class="map-fab map-fab-walk" id="walk-toggle" title="歩いた道を記録する">記録</button>
    <button type="button" class="map-fab map-fab-locate" id="locate" aria-label="現在地" title="現在地">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7" fill="none" stroke="#1A73E8" stroke-width="2"/>
        <circle cx="12" cy="12" r="3.2" fill="#1A73E8"/>
        <path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5" stroke="#1A73E8" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</main>
<form class="pin-sheet" id="pin-sheet" hidden>
  <h2>ピンを立てる</h2>
  <p class="pin-where" id="pin-where"></p>
  <div class="pin-tags" id="pin-tags"></div>
  <textarea name="body" maxlength="500" placeholder="ひとこと（任意。写真だけでもOK）"></textarea>
  <input type="file" id="pin-photo" accept="image/jpeg,image/png,image/webp">
  <img class="pin-preview" id="pin-preview" alt="選んだ写真" hidden>
  <label class="pin-public">
    <input type="checkbox" name="is_public" checked>
    <span>みんなに公開する（オフにすると自分だけに表示）</span>
  </label>
  <p class="pin-error" id="pin-error"></p>
  <div class="route-actions">
    <button type="button" class="button button-secondary" id="pin-cancel">キャンセル</button>
    <button type="submit" class="button button-primary">投稿する</button>
  </div>
</form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // 日立市付近を初期表示にする（拡大・縮小はピンチ操作・マウスホイールで行うので、＋－ボタンは出さない）
  const map = L.map("map", { zoomControl: false }).setView([36.5995, 140.651], 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  // 経路検索できる範囲（地図データの範囲）を枠で示し、枠の外は表示しないようにする
  //  - 縮小できるのは「画面が枠の中に収まる」ところまで
  //  - ドラッグしても枠の外へは動かない
  fetch("/api/area").then((r) => r.ok ? r.json() : null).then((a) => {
    if (!a) return;
    const area = L.latLngBounds([[a.south, a.west], [a.north, a.east]]);
    L.rectangle(area, { color: "#2E6BB0", weight: 2, fill: false, interactive: false }).addTo(map);
    map.setMaxBounds(area);
    map.options.maxBoundsViscosity = 1.0;  // 枠の端で止める（はみ出して戻る動きをなくす）

    // 画面の大きさから、枠の外が見えない一番小さいズームを計算する
    const fitMinZoom = () => {
      map.invalidateSize();
      map.setMinZoom(map.getBoundsZoom(area, true));
      map.panInsideBounds(area, { animate: false });
    };
    fitMinZoom();
    // 先に現在地が取れていて枠の中なら、現在地を中心にしたままにする（current_location.js）
    const here = window.currentLocation;
    if (here && area.contains(here)) map.setView(here, Math.max(map.getZoom(), map.getMinZoom()));
    else map.setView(area.getCenter(), map.getMinZoom());

    // 画面の向きや大きさ、上のパネルの高さが変わったときも計算し直す
    new ResizeObserver(fitMinZoom).observe(document.getElementById("map"));
  });

  const bannerEl = document.getElementById("route-banner");
  const messageEl = document.getElementById("message");
  const resetBtn = document.getElementById("reset");  // 案内文の「×」。経路を選んでいる最中だけ出す
  // 出発地・目的地は「地図上の地点」か「施設（駅・学校など）」のどちらか。
  // 施設のときは origFacility / destFacility に施設が入り、経路は入口の組み合わせのうち一番近いものになる
  let orig = null, dest = null, origMarker = null, destMarker = null, routeLine = null;
  let origFacility = null;
  let pendingFacility = null;  // 出発地より先に「ここへ行く」を押された施設

  // 案内文を出す。空文字なら案内の枠ごと隠す（経路を選んでいる最中は「×」があるので枠を残す）
  function setMessage(text) {
    messageEl.textContent = text;
    bannerEl.hidden = !text && resetBtn.hidden;
  }
  window.setRouteMessage = setMessage;  // pins.js からも使う

  // 経路の所要時間の表示。所要時間はサーバが自分の歩く速さ（歩行ログから計算）で出したもので、
  // 坂道では遅くなる分を含む。経路も所要時間が一番短くなるように選ばれている
  function walkTimeText(route) {
    if (route.duration_min == null) return "";
    const minutes = Math.max(1, Math.round(route.duration_min));
    const slope = route.slope_m >= 1 ? `・うち坂道 約 ${Math.round(route.slope_m)} m` : "";
    return `（約 ${minutes} 分${slope}）`;
  }

  function reset() {
    [origMarker, destMarker, routeLine].forEach((layer) => layer && map.removeLayer(layer));
    orig = dest = origMarker = destMarker = routeLine = routeResult = null;
    origFacility = pendingFacility = null;
    modesEl.hidden = true;
    resetBtn.hidden = true;
    setMessage("");
  }

  function clearDestination() {
    [destMarker, routeLine].forEach((layer) => layer && map.removeLayer(layer));
    dest = destMarker = routeLine = routeResult = null;
    modesEl.hidden = true;
  }

  function setOrig(latlng, facility = null) {
    orig = latlng;
    origFacility = facility;
    if (origMarker) map.removeLayer(origMarker);
    const label = facility ? `出発：${facility.name}` : "出発地";
    origMarker = L.marker(latlng).addTo(map).bindTooltip(label, { permanent: true });
    resetBtn.hidden = false;
    setMessage("次に目的地をタップするか、施設のピンを選んで「ここへ行く」を押してください。");
    // 先に施設の「ここへ行く」が押されていたら、その施設への経路を探す
    if (pendingFacility) {
      const target = pendingFacility;
      pendingFacility = null;
      planRoute(target, null);
    }
  }

  function placeLabel(facility, point) {
    if (!facility) return "";
    return point && point.name ? `${facility.name}（${point.name}）` : facility.name;
  }

  // ---- 通常（距離が最短）／坂道考慮（所要時間が最短）の切り替え ----
  // サーバは両方の経路を返すので、切り替えは再検索せずに描き直すだけ。選んだモードは端末に覚えておく
  const MODE_KEY = "routeMode";
  const modesEl = document.getElementById("route-modes");
  const modeBtns = modesEl.querySelectorAll(".route-mode");
  let routeMode = "slope";
  try { if (localStorage.getItem(MODE_KEY) === "normal") routeMode = "normal"; } catch (e) { /* 既定のまま */ }
  let routeResult = null;  // { data: /api/route/plan の結果, destFac }

  function updateModeButtons() {
    modeBtns.forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === routeMode ? "true" : "false"));
  }
  updateModeButtons();
  modeBtns.forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.mode === routeMode) return;
    routeMode = b.dataset.mode;
    try { localStorage.setItem(MODE_KEY, routeMode); } catch (e) { /* 覚えられなくても切り替えはできる */ }
    updateModeButtons();
    if (routeResult) showRoute(false);
  }));

  // 2つの経路が同じか（入口の選び方と距離で判断する）
  function sameRoute(a, b) {
    return a.start.name === b.start.name && a.goal.name === b.goal.name && Math.abs(a.distance_m - b.distance_m) < 1;
  }

  // 選んでいないほうの経路との違いを1行で表す
  function compareText(slope, normal) {
    if (!slope.slope_aware) return "※地図データに標高が無いため、坂道を考慮できていません。";
    if (sameRoute(slope, normal)) return "坂道を通っても一番早いため、通常と同じ経路です。";
    const diff = Math.round(normal.duration_min - slope.duration_min);
    const diffText = diff >= 1 ? `約 ${diff} 分` : "少し";
    const lessSlope = Math.round(normal.slope_m - slope.slope_m);
    if (routeMode === "slope") {
      return `通常の経路より${diffText}早く着きます`
        + (lessSlope >= 1 ? `（坂道が 約 ${lessSlope} m 少ない）。` : "。") + "灰色の点線は通常の経路です。";
    }
    return `坂道を考慮した経路なら${diffText}早く着きます（灰色の点線）。`;
  }

  // 計算に使った歩く速さ（歩行ログから計算。足りないところは標準・仮の値）
  function speedsText(s) {
    if (!s) return "";
    const flat = `普通の道 ${walkFormat.speed(s.speed_m_per_min)}` + (s.is_default ? "（標準）" : "");
    const slope = `坂道 ${walkFormat.speed(s.slope_speed_m_per_min)}` + (s.slope_is_default ? "（仮）" : "");
    return `\n計算に使った速さ：${flat}・${slope}`;
  }

  // routeResult を routeMode に合わせて描く。fit が true なら両方の経路が収まるように地図を動かす
  function showRoute(fit) {
    const { data, destFac } = routeResult;
    const normal = data.normal || data;
    const route = routeMode === "normal" ? normal : data;
    const other = routeMode === "normal" ? data : normal;
    if (routeLine) map.removeLayer(routeLine);

    const lines = [];
    if (!sameRoute(route, other)) {
      // もう一方の経路は、比べられるよう灰色の点線で下に敷く
      lines.push(L.polyline(other.coords, { color: "#777", weight: 4, opacity: 0.8, dashArray: "4 8", interactive: false }));
    }
    lines.push(L.polyline(route.coords, { color: "#2E6BB0", weight: 6 }));
    // 敷地内（校内など）の、地点と門の間は道の情報が無いので点線でつなぐ
    const insideLeg = (from, to) => L.polyline([from, to],
      { color: "#2E6BB0", weight: 4, dashArray: "6 8", interactive: false });

    // 出発地が施設なら、実際に使う出口の位置へ印を動かす
    let startLabel = "出発地";
    const startGate = L.latLng(route.start.lat, route.start.lon);
    if (origFacility) {
      startLabel = placeLabel(origFacility, route.start);
      origMarker.setLatLng(startGate).setTooltipContent(`出発：${startLabel}`);
    } else if (data.orig_facility && data.orig_facility.inside) {
      // 出発地が敷地の中 → 一番近くなる門から出る
      startLabel = `出発地（${data.orig_facility.name}内）→ ${route.start.name || "入口"}`;
      lines.push(insideLeg(orig, startGate));
    }
    let goalLabel = "目的地";
    const goalGate = L.latLng(route.goal.lat, route.goal.lon);
    if (destFac) {
      goalLabel = placeLabel(destFac, route.goal);
      if (destMarker) map.removeLayer(destMarker);
      dest = goalGate;
      destMarker = L.marker(dest).addTo(map).bindTooltip(goalLabel, { permanent: true });
    } else if (data.dest_facility && data.dest_facility.inside) {
      // 目的地が敷地の中 → 一番近くなる門から入る
      goalLabel = `${route.goal.name || "入口"} → 目的地（${data.dest_facility.name}内）`;
      lines.push(insideLeg(goalGate, dest));
    }
    routeLine = L.featureGroup(lines).addTo(map);
    if (fit) map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    modesEl.hidden = false;
    const modeName = routeMode === "normal" ? "通常" : "坂道考慮";
    setMessage(`【${modeName}】${startLabel} → ${goalLabel}　約 ${Math.round(route.distance_m)} m${walkTimeText(route)}\n`
      + compareText(data, normal) + speedsText(data.speeds));
  }

  // 経路を探して表示する。目的地は destFac（施設）か destLatLng（地点）のどちらか
  async function planRoute(destFac, destLatLng) {
    clearDestination();
    const params = new URLSearchParams();
    if (origFacility) params.set("orig_facility", origFacility.id);
    else { params.set("orig_lat", orig.lat); params.set("orig_lon", orig.lng); }
    if (destFac) params.set("dest_facility", destFac.id);
    else { params.set("dest_lat", destLatLng.lat); params.set("dest_lon", destLatLng.lng); }

    // 地点をタップしたときは、検索中も目的地の印を出しておく
    if (destLatLng) {
      dest = destLatLng;
      destMarker = L.marker(dest).addTo(map).bindTooltip("目的地", { permanent: true });
    }
    setMessage("経路を検索しています…");
    try {
      const res = await fetch("/api/route/plan?" + params);
      if (res.status === 401) { location.href = "/login"; return; }
      const data = await res.json();
      if (!res.ok) {
        clearDestination();  // 目的地だけ選び直せるようにする
        setMessage((data.error || "経路を取得できませんでした。") + " 目的地を選び直してください。");
        return;
      }
      routeResult = { data, destFac };
      showRoute(true);
    } catch (e) {
      clearDestination();
      setMessage("通信に失敗しました。");
    }
  }

  // ---- facilities.js のポップアップのボタンから呼ばれる ----
  // 「ここへ行く」
  window.goToFacility = (facility) => {
    map.closePopup();
    if (window.emergencyMode) return;
    if (!orig) {
      pendingFacility = facility;
      setMessage(`${facility.name}へ行きます。出発地を地図でタップするか、施設の「ここから出発」か、右下の「現在地」を押してください。`);
      return;
    }
    if (origFacility && origFacility.id === facility.id) {
      setMessage("出発地と同じ施設です。別の目的地を選んでください。");
      return;
    }
    planRoute(facility, null);
  };

  // 「ここから出発」
  window.startFromFacility = (facility) => {
    map.closePopup();
    if (window.emergencyMode) return;
    const target = pendingFacility && pendingFacility.id !== facility.id ? pendingFacility : null;
    reset();
    pendingFacility = target;
    setOrig(L.latLng(facility.lat, facility.lon), facility);
  };

  map.on("click", (e) => {
    if (window.pinMode || window.emergencyMode) return;  // ピンを立てる操作中・緊急時は経路用に使わない
    if (!orig) {
      setOrig(e.latlng);
    } else if (!dest) {
      planRoute(null, e.latlng);
    }
  });

  resetBtn.addEventListener("click", reset);

  // 右下の「現在地」ボタン：現在地へ移動して、そこを出発地にする
  document.getElementById("locate").addEventListener("click", () => {
    const useLatLng = (latlng) => {
      const area = map.options.maxBounds;  // 地図に表示できる範囲（/api/area の枠）
      if (area && !area.contains(latlng)) { setMessage("現在地が地図の範囲外のため、出発地にできません。"); return; }
      if (window.pinMode) { map.setView(latlng, 16); return; }  // ピンを立てる操作中は移動だけ
      const facility = pendingFacility;  // reset で消えないように退避
      reset();
      pendingFacility = facility;
      setOrig(latlng);
      map.setView(latlng, 16);
    };
    // 地図に表示中の現在地があればそれを使う（current_location.js）
    if (window.currentLocation) { useLatLng(window.currentLocation); return; }
    if (!navigator.geolocation) { setMessage("この端末では現在地を取得できません。"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => useLatLng(L.latLng(pos.coords.latitude, pos.coords.longitude)),
      () => setMessage("現在地を取得できませんでした。地図をタップして選んでください。"),
    );
  });
</script>
